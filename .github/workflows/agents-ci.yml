name: Agents CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: 20
      - name: Install Node dependencies
        run: npm install
      - name: Validate agent metadata
        env:
          NODE_OPTIONS: "--loader=./scripts/ts-loader.mjs"
        run: node scripts/validate_agents.ts
      - name: Check catalog coverage
        env:
          NODE_OPTIONS: "--loader=./scripts/ts-loader.mjs"
        run: node scripts/sync_from_catalog.ts --check
      - name: Run Jest tests
        run: npm run test:js
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: pip install pytest
      - name: Run Pytest
        run: npm run test:py
