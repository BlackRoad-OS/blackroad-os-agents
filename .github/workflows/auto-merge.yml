name: Auto-Merge Everything
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Auto-merge PRs
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash || \
            echo "Auto-merge could not be enabled (branch protection may not require checks). Skipping."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy on push
        if: github.event_name == 'push'
        run: |
          echo "Deployment triggered by Cloudflare Worker"
          curl -X POST https://blackroad-deploy-dispatcher.amundsonalexa.workers.dev/webhook/github \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${{ github.ref }}\",\"repository\":{\"full_name\":\"${{ github.repository }}\"},\"after\":\"${{ github.sha }}\",\"pusher\":{\"name\":\"${{ github.actor }}\"}}" || true
